:50%;font-size:20px}.round:hover{background:#fff}.round.next{background:#f05a24;border-color:#f05a24;color:white}.round:disabled{opacity:.2;cursor:default}.page{font-size:13px;color:#91809f;min-width:70px;text-align:center}.progress{height:3px;background:#f05a24;position:fixed;bottom:0;left:0;transition:width .3s}details{font-size:11px;color:#a08cab;margin-top:22px;max-width:1050px}summary{cursor:pointer}details p{font-size:12px;margin-top:8px}.cover details{display:none}.loading{color:#a18dab;font-size:18px;padding:60px 0}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #f7b69c;outline-offset:4px}@keyframes enter{from{opacity:0;transform:translateX(15px)}to{opacity:1;transform:translateX(0)}}@media(max-width:800px){.pipeline{flex-direction:column}body{font-size:16px}.top{height:61px;margin-inline:22px;font-size:10px}.top b{font-size:19px}main{padding:26px 25px 100px}h1{font-size:72px;letter-spacing:-4px;margin-top:40px}h2{font-size:31px;letter-spacing:-.9px;margin-top:18px}.sub{font-size:20px;margin-bottom:24px}.cover .sub{font-size:26px}.copy{font-size:17px;line-height:1.7}.copy p{margin-bottom:19px}.cover .copy{font-size:14px}.check-order{font-size:10px}.figure{height:auto;width:100%;min-height:0;margin-top:25px}.controls{height:76px}.top>a:last-child{font-size:10px}.round{width:40px;height:40px}.cover-links{gap:10px}a.primary,.link{font-size:12px;padding:12px 17px}}
</style></head><body><header class="top"><a href="./"><b>опора<span>.</span></b></a><span>ПРЕЗЕНТАЦИЯ РЕШЕНИЯ</span><a href="./" target="_blank">Открыть демонстрацию ↗</a></header><main id="slide"><p class="loading">Загружаем презентацию...</p></main><nav class="controls" aria-label="Навигация по слайдам"><button class="round" id="prev" aria-label="Предыдущий слайд">←</button><span class="page" id="page"></span><button class="round next" id="next" aria-label="Следующий слайд">→</button></nav><div class="progress" id="progress"></div><script>
const el=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let slides=[],i=Math.max(0,(parseInt(location.hash.slice(1))||1)-1);
function show(){i=Math.min(Math.max(i,0),slides.length-1);const s=slides[i],cover=i===0;el('slide').innerHTML=`<article class="${cover?'cover':''}">${cover?'<h1>'+escape(s.title)+'</h1>':'<h2>'+escape(s.title)+'</h2>'}<div class="sub">${escape(s.subtitle)}</div>${s.image?'<a href="./" target="_blank" aria-label="Открыть интерактивную демонстрацию"><img class="figure" src="showcase-preview.png" alt="Интерфейс: вывод и подтверждающая цитата"></a>':'<div class="copy">'+s.body.split('\n\n').map(p=>'<p>'+escape(p).replace(/\n/g,'<br>')+'</p>').join('')+'</div>'}${s.diagram?'<div class="pipeline">'+s.diagram.map(v=>'<span>'+escape(v)+'</span>').join('')+'</div>':''}${cover?'<div class="cover-links"><a class="primary" href="./" target="_blank">Проверить решение ↗</a><a class="link" href="https://github.com/antonshkelll/opora-psb" target="_blank" rel="noreferrer">Репозиторий ↗</a><a class="link" href="presentation.pdf" target="_blank">Скачать PDF ↓</a></div><p class="check-order">Порядок проверки: выбрать учебный сценарий → прочитать вывод → открыть цитату и документ. Живой запуск и ограничения описаны в README репозитория.</p>':(s.foot?'<details><summary>Источники и ограничения</summary><p>'+escape(s.foot)+'</p></details>':'')}</article>`;el('page').textContent=String(i+1).padStart(2,'0')+' / '+slides.length;el('progress').style.width=((i+1)/slides.length*100)+'%';el('prev').disabled=i===0;el('next').disabled=i===slides.length-1;history.replaceState(null,'','#'+(i+1));window.scrollTo(0,0)}
el('prev').onclick=()=>{i--;show()};el('next').onclick=()=>{i++;show()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();i++;show()}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();i--;show()}if(e.key==='Home'){i=0;show()}if(e.key==='End'){i=slides.length-1;show()}});let touchX=0;document.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{let d=touchX-e.changedTouches[0].clientX;if(Math.abs(d)>70){i+=d>0?1:-1;show()}},{passive:true});fetch('slides.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{slides=d;show()}).catch(()=>el('slide').textContent='Презентация не загрузилась. Обновите страницу.');
